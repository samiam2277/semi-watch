<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="chart.umd.min.js"></script>
<style>body{background:#161b22;margin:0;padding:8px}</style></head><body>
<canvas id="c" style="width:100%;height:280px"></canvas>
<script>
setTimeout(function(){

var outflow=[-15,0,0,0,0,0,0,-20,-30,-25,0,0,-35,-25,-15,-8,0,0];
var cumul=[-10,25,80,125,155,175,183,163,133,108,128,138,103,78,63,55,85,135];
new Chart(ctx,{type:"bar",data:{labels:L,datasets:[
{label:"流入($亿)",data:inflow,backgroundColor:"rgba(63,185,80,0.7)",borderColor:"#3fb950",borderWidth:1,borderRadius:2,stack:"s"},
{label:"流出($亿)",data:outflow,backgroundColor:"rgba(248,81,73,0.7)",borderColor:"#f85149",borderWidth:1,borderRadius:2,stack:"s"},

]},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:"index"},plugins:{legend:{labels:{color:"#8b949e",font:{size:9},usePointStyle:true,padding:14}}},scales:{x:{stacked:true,ticks:{color:"#8b949e",font:{size:8},maxTicksLimit:12},grid:{display:false}},y:{stacked:true,position:"left",ticks:{color:"#8b949e",font:{size:8},callback:function(v){return(v>=0?"+":"")+"$"+v+"亿"}},grid:{color:"rgba(48,54,61,0.25)"}},y1:{position:"right",ticks:{color:"#d2991d",font:{size:8},callback:function(v){return"$"+v+"亿"}},grid:{display:false}}}}});
},300);
</script>
</body></html>
