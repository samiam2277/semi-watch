<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>body{background:#161b22;color:#c9d1d9;font-family:-apple-system,sans-serif;margin:0;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 170px;gap:8px;height:100%}
.panel{font-size:10px;color:#8b949e;overflow-y:auto;max-height:270px}
.panel .sig{padding:5px 7px;margin:2px 0;border-radius:4px;font-size:10px}
.sig-r{background:rgba(248,81,73,0.12);border-left:3px solid #f85149}
.sig-g{background:rgba(63,185,80,0.12);border-left:3px solid #3fb950}
.sig-y{background:rgba(210,153,29,0.12);border-left:3px solid #d2991d}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<div class="grid2">
<div style="position:relative"><canvas id="c" style="width:100%;height:280px"></canvas></div>
<div class="panel">
<div style="font-weight:600;color:#c9d1d9;margin-bottom:8px;font-size:11px">HYG 信用风险解读</div>
<div class="sig sig-g"><b>HYG上涨=风险偏好升</b><br>1-6月稳步上行<br>信用市场健康 支撑科技股</div>
<div class="sig sig-r"><b>7月急跌=信用收缩</b><br>HYG从$78→$74(−5%)<br>高收益债遭抛售→流动性紧张</div>
<div class="sig sig-y"><b>HYG与SOX背离</b><br>SOX-25% 但HYG仅-5%<br>→ 非系统性危机 只是轮动</div>
<div style="margin-top:6px;font-size:9px;border-top:1px solid #30363d;padding-top:4px">
当前: <span style="color:#d2991d">$74.5 弱企稳</span><br>
若跌破$72→信用危机预警<br>
当前$74→正常回调范围
</div>
</div>
</div>
<script>
setTimeout(function(){
var ctx=document.getElementById('c').getContext('2d');
var labels=['1月','2月','3月','4月','5月上','5月下','6月初','6月中','6月下','7月初','7/8','7/14','7/18','7/22','7/25','7/28','7/29','7/30','7/31'];
var hyg=[77.2,77.0,77.5,78.0,78.3,78.5,78.8,78.6,78.2,77.8,77.2,76.5,76.0,75.5,75.0,74.2,73.8,74.5,74.5];
var sox=[7575,7200,7080,8300,10300,11600,12000,14342,13204,13353,12301,13171,11768,14635,13482,10447,10447,11303,11800];
var soxS=sox.map(function(v){{return v/190}});
new Chart(ctx,{type:'line',
  data:{labels:labels,datasets:[
    {label:'HYG高收益债($)',data:hyg,borderColor:'#d2991d',backgroundColor:'rgba(210,153,29,0.08)',fill:true,tension:0.4,pointRadius:2,borderWidth:2.5,yAxisID:'y'},
    {label:'SOX÷190(对标)',data:soxS,borderColor:'#58a6ff',tension:0.4,pointRadius:0,borderWidth:1.5,borderDash:[5,3],yAxisID:'y'}
  ]},
  options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#8b949e',font:{size:9},usePointStyle:true,padding:14}}},
    scales:{
      x:{ticks:{color:'#8b949e',font:{size:8},maxTicksLimit:12},grid:{display:false}},
      y:{ticks:{color:'#8b949e',font:{size:8}},grid:{color:'rgba(48,54,61,0.25)'},title:{display:true,text:'HYG $',color:'#8b949e',font:{size:8}}}
    }
  }});
},300);
</script>
</body></html>
