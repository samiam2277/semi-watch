<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="chart.umd.min.js"></script>
<style>body{background:#161b22;color:#c9d1d9;font-family:-apple-system,sans-serif;margin:0;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 190px;gap:8px;height:100%}
.panel{font-size:10px;color:#8b949e;overflow-y:auto;max-height:270px}
.panel .sig{padding:5px 7px;margin:2px 0;border-radius:4px;font-size:10px}
.sig-r{background:rgba(248,81,73,0.15);border-left:3px solid #f85149}
.sig-g{background:rgba(63,185,80,0.12);border-left:3px solid #3fb950}
.sig-y{background:rgba(210,153,29,0.12);border-left:3px solid #d2991d}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
</style></head><body><div id="err" style="display:none;color:red;padding:10px;font-size:11px;background:#300;border-radius:4px;margin:4px"></div>
<div class="grid2">
<div style="position:relative"><canvas id="c" style="width:100%;height:280px"></canvas></div>
<div class="panel">
<div style="font-weight:600;color:#c9d1d9;margin-bottom:8px;font-size:11px">📊 特朗普影响力判据</div>
<div class="sig sig-r"><b>2024/11 影响力峰值</b><br>当选后"减税+放松监管"言论<br>SOX单周+8%+BTC破10万</div>
<div class="sig sig-y"><b>2025/4 关税冲击</b><br>对华芯片禁令升级<br>SOX单日-6% VIX+40%</div>
<div class="sig sig-r"><b>2026/1 影响力次峰</b><br>就职日 "AI曼哈顿计划"<br>半导体暴涨 单月+15%</div>
<div class="sig sig-y"><b>2026/7 影响力衰减</b><br>"狠狠地打伊朗"喊话后<br>油价仅涨2% SOX未反应<br>→市场对特朗普脱敏</div>
<div class="sig sig-g"><b>🔮 影响力见底？</b><br>若继续脱敏→市场回归基本面<br>若大选临近再升温→波动加大<br>当前: 45(底部区域)</div>
<div style="margin-top:6px;font-size:9px;border-top:1px solid #30363d;padding-top:4px">
峰值: <span style="color:#f85149">95 (2024/11)</span><br>
当前: <span style="color:#3fb950">45 (脱敏区)</span><br>
<span style="font-size:8px">*基于推文市场反应+媒体热度</span>
</div>
</div>
</div>
<script>
function initChart(){
  var err=document.getElementById('err');
  try{
    if(typeof Chart==='undefined'){setTimeout(initChart,200);return;}
    var c=document.getElementById('c');
    if(!c){err.style.display='block';err.textContent='Canvas #c 未找到';return;}
    var ctx=c.getContext('2d');
    if(!ctx){err.style.display='block';err.textContent='Canvas 2D 不支持';return;}
var ctx=document.getElementById('c').getContext('2d');
var labels=['24/7','24/9','24/11','24/12','25/1','25/2','25/3','25/4','25/5','25/6','25/7','25/8','25/9','25/10','25/11','25/12','26/1','26/2','26/3','26/4','26/5','26/6','26/7','26/7下','8/1'];
var influence=[30,45,95,80,65,55,70,88,72,60,50,40,35,55,75,60,85,50,45,40,35,30,42,25,20];
var sox=[5500,5400,5800,7575,7400,7000,7080,8300,10300,11600,14342,13204,11800,11300,11600,12000,14655,7000,7500,9556,11600,14655,10447,11800,11800];
var soxS=sox.map(function(v){return v/160});
try{new Chart(ctx,{type:'line',
  data:{labels:labels,datasets:[
    {label:'特朗普影响力指数',data:influence,borderColor:'#f85149',backgroundColor:'rgba(248,81,73,0.08)',fill:true,tension:0.4,pointRadius:2,borderWidth:2.5,yAxisID:'y'},
    {label:'SOX(÷160)',data:soxS,borderColor:'#58a6ff',tension:0.4,pointRadius:0,borderWidth:1.5,borderDash:[5,3],yAxisID:'y'}
  ]},
  options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
    plugins:{legend:{labels:{color:'#8b949e',font:{size:9},usePointStyle:true,padding:14}}},
    scales:{
      x:{ticks:{color:'#8b949e',font:{size:7},maxTicksLimit:14},grid:{display:false}},
      y:{ticks:{color:'#8b949e',font:{size:8}},grid:{color:'rgba(48,54,61,0.25)'},min:0,max:110,title:{display:true,text:'影响力指数',color:'#8b949e',font:{size:8}}}
    }
  }
});
  err.style.display='none';}catch(e){err.style.display='block';err.textContent='JS错误: '+e.message;}}initChart();
</script>
</body></html>
