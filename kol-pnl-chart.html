<!DOCTYPE html><html><head><meta charset="UTF-8">
<script>
(function(){
  var s=document.createElement('script');
  s.src='chart.umd.min.js';
  s.onload=function(){ window._chartReady=true; };
  s.onerror=function(){ document.body.innerHTML+='<div style=color:red>Chart.js加载失败</div>'; };
  document.head.appendChild(s);
},300);
</script>
<style>body{background:#161b22;color:#c9d1d9;font-family:-apple-system,sans-serif;margin:0;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 175px;gap:8px;height:100%}
.panel{font-size:10px;color:#8b949e;overflow-y:auto;max-height:270px}
.panel .sig{padding:5px 7px;margin:2px 0;border-radius:4px;font-size:10px}
.sig-r{background:rgba(248,81,73,0.12);border-left:3px solid #f85149}
.sig-g{background:rgba(63,185,80,0.12);border-left:3px solid #3fb950}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<div class="grid2">
<div style="position:relative"><canvas id="c" style="width:100%;height:280px"></canvas></div>
<div class="panel">
<div style="font-weight:600;color:#c9d1d9;margin-bottom:8px;font-size:11px">KOL P&L 解读</div>
<div class="sig sig-g"><b>1-6月中 集体暴赚</b><br>半导体KOL平均+200%<br>Situational Awareness +439%</div>
<div class="sig sig-r"><b>6月下 SA开始回撤</b><br>4x杠杆基金从+439%暴跌<br>7/29被强平 Citadel接盘</div>
<div class="sig sig-r"><b>7月 集体巨亏</b><br>存储KOL平均-45%<br>杠杆ETF KOL -70%+</div>
<div class="sig sig-g"><b>7/30-31 暴力回血</b><br>一天回补15-30%<br>但多数仍深亏</div>
<div style="margin-top:6px;font-size:9px;border-top:1px solid #30363d;padding-top:4px">
SA:<span style="color:#f85149">+439%→爆仓</span><br>
存储多头:<span style="color:#f85149">+250%→-20%</span><br>
杠杆ETF党:<span style="color:#f85149">+180%→-70%</span><br>
Burry空头:<span style="color:#3fb950">+35%</span>
</div>
</div>
</div>
<script>
setTimeout(function(){
var ctx=document.getElementById('c').getContext('2d');
var labels=["1\u6708", "2\u6708", "3\u6708", "4\u6708", "5\u6708", "6\u6708\u521d", "6/15", "6/22", "6/28", "7/5", "7/12", "7/18", "7/22", "7/25", "7/28", "7/29", "7/30", "7/31"]

new Chart(ctx,{type:'line',
  data:{labels:labels,datasets:[
    {label:'Situational Awareness',data:sa,borderColor:'#f85149',tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y'},
    {label:'存储多头(平均)',data:long,borderColor:'#3fb950',tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y'},
    {label:'杠杆ETF党(平均)',data:lever,borderColor:'#d2991d',tension:0.4,pointRadius:1.5,borderWidth:2,borderDash:[5,3],yAxisID:'y'},
    {label:'Burry空头',data:burry,borderColor:'#a371f7',tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y'}
  ]},
  options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
    plugins:{legend:{labels:{color:'#8b949e',font:{size:8},usePointStyle:true,padding:12}}},
    scales:{
      x:{ticks:{color:'#8b949e',font:{size:8},maxTicksLimit:12},grid:{display:false}},
      y:{ticks:{color:'#8b949e',font:{size:8},callback:function(v){{return(v>=0?'+':'')+v+'%'}}},grid:{color:'rgba(48,54,61,0.25)'},title:{display:true,text:'累计盈亏%',color:'#8b949e',font:{size:8}}}
    }
  }});
},300);
</script>
</body></html>
