<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>body{background:#161b22;color:#c9d1d9;font-family:-apple-system,sans-serif;margin:0;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 170px;gap:8px;height:100%}
.panel{font-size:10px;color:#8b949e;overflow-y:auto;max-height:270px}
.panel .sig{padding:5px 7px;margin:2px 0;border-radius:4px;font-size:10px}
.sig-r{background:rgba(248,81,73,0.12);border-left:3px solid #f85149}
.sig-g{background:rgba(63,185,80,0.12);border-left:3px solid #3fb950}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<div class="grid2">
<div style="position:relative"><canvas id="c" style="width:100%;height:280px"></canvas></div>
<div class="panel">
<div style="font-weight:600;color:#c9d1d9;margin-bottom:8px;font-size:11px">Put/Call 解读</div>
<div class="sig sig-r"><b>P/C >1.2 极度恐慌</b><br>6月末、7月末触此区<br>通常=短期底部临近</div>
<div class="sig sig-g"><b>P/C <0.6 极度贪婪</b><br>5月、6月初触此区<br>市场过度乐观=顶部信号</div>
<div class="sig sig-y"><b>P/C 0.7-1.0 正常</b><br>3-4月、当前回此区<br>情绪中性 方向看基本面</div>
<div style="margin-top:6px;font-size:9px;border-top:1px solid #30363d;padding-top:4px">
当前: <span style="color:#3fb950">~0.85 中性偏谨慎</span><br>
恐慌底:6月末1.35 7月末1.42<br>
贪婪顶:5月初0.55 6月初0.52
</div>
</div>
</div>
<script>
setTimeout(function(){
var ctx=document.getElementById('c').getContext('2d');
var labels=['1月','2月初','2月中','3月','3月下','4月','4月下','5月上','5月下','6月初','6月中','6月下','7月初','7月中','7/22','7/25','7/28','7/29','7/30','7/31'];
var pc=[0.82,0.88,0.95,0.78,0.72,0.68,0.62,0.55,0.58,0.52,0.60,0.85,1.05,1.15,1.22,1.30,1.38,1.42,1.10,0.85];
new Chart(ctx,{type:'line',
  data:{labels:labels,datasets:[
    {label:'Put/Call比率',data:pc,borderColor:'#a371f7',backgroundColor:'rgba(163,113,247,0.08)',fill:true,tension:0.4,pointRadius:2,borderWidth:2.5},
  ]},
  options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#8b949e',font:{size:9},usePointStyle:true,padding:14}}},
    scales:{
      x:{ticks:{color:'#8b949e',font:{size:8},maxTicksLimit:12},grid:{display:false}},
      y:{min:0.3,max:1.8,ticks:{color:'#8b949e',font:{size:8}},grid:{color:'rgba(48,54,61,0.25)'},
        title:{display:true,text:'P/C比率',color:'#8b949e',font:{size:8}}}
    }
  }});
},300);
</script>
</body></html>
