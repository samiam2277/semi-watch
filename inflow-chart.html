<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>html,body{height:100%;overflow:hidden;background:#161b22;color:#c9d1d9;font-family:sans-serif;margin:0;padding:8px}</style></head><body>
<canvas id="c" style="width:100%;height:260px;max-height:260px;max-height:260px;max-height:260px"></canvas>
<script>
var sc=document.createElement('script');sc.src='chart.umd.min.js';
sc.onload=function(){
var labels=['5/1','5/8','5/15','5/22','5/29','6/5','6/12','6/19','6/22','6/26','7/1','7/3','7/8','7/10','7/14','7/17','7/21','7/23','7/25','7/28','7/29','7/30','7/31'];
var etfIn=[15,18,22,20,25,28,20,15,-5,-10,-8,-12,54,15,10,5,8,12,-28,-15,-20,38,42];
var krForeign=[3,5,8,6,4,2,-5,-10,-15,-20,-25,-30,-5,0,8,3,6,2,-18,-35,-40,5,60];
var cumul=[0];for(var i=0;i<etfIn.length;i++)cumul.push(cumul[i]+etfIn[i]+krForeign[i]);cumul.shift();
var ctx=document.getElementById('c').getContext('2d');
new Chart(ctx,{type:'bar',data:{labels:labels,datasets:[
  {label:'ETF流入($亿)',data:etfIn,backgroundColor:function(c){return etfIn[c.dataIndex]>=0?'rgba(88,166,255,0.7)':'rgba(248,81,73,0.7)'},borderRadius:2,stack:'s1'},
  {label:'韩国外资($亿)',data:krForeign,backgroundColor:function(c){return krForeign[c.dataIndex]>=0?'rgba(63,185,80,0.6)':'rgba(200,80,80,0.6)'},borderRadius:2,stack:'s1'},
  {label:'累计($亿)',data:cumul,borderColor:'#d2991d',tension:0.4,pointRadius:2,borderWidth:2.5,type:'line',yAxisID:'y1'}
]},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:"index"},plugins:{tooltip:{callbacks:{label:function(c){return c.dataset.label+": "+(c.parsed.y>=0?"+":"")+c.parsed.y.toFixed(1);}}}},
  plugins:{legend:{labels:{color:'#8b949e',font:{size:9}}}},
  scales:{x:{stacked:true,ticks:{color:'#8b949e',font:{size:8},maxTicksLimit:14},grid:{display:false}},
  y:{stacked:true,ticks:{color:'#8b949e',font:{size:8},callback:function(v){return(v>=0?'+':'')+'$'+v+'亿'}},grid:{color:'rgba(48,54,61,0.25)'}},
  y1:{position:'right',ticks:{color:'#d2991d',font:{size:8},callback:function(v){return'$'+v+'亿'}},grid:{display:false}}}
}});
};
sc.onerror=function(){document.body.innerHTML+='<div style=color:red>chart.umd.min.js 404</div>';};
document.head.appendChild(sc);
</script>
</body></html>
