<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--green:#3fb950;--red:#f85149;--yellow:#d2991d;--text:#c9d1d9;--text2:#8b949e;--accent:#58a6ff}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px}.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}.card h3{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px}.metric{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(48,54,61,0.5)}.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--yellow)}.card-auto{background:#1a2030;border:1px solid #2a4a6d;border-left:3px solid #58a6ff}.card-auto h3{color:#58a6ff}.card-weekly{background:#1a2030;border:1px solid #2a4a3d;border-left:3px solid #3fb950}.card-weekly h3{color:#3fb950}</style></head><body>
<div class="header" style="text-align:center;padding:20px 0 30px;border-bottom:1px solid var(--border);margin-bottom:24px"><h1 style="font-size:28px">Test 3: Dashboard clone</h1></div>
<div class="grid grid-2">
<div class="card-auto"><h3>🇰🇷 Test Panel</h3><div class="metric"><span class="label">Test</span><span class="value up">OK</span></div></div>
<div class="card-weekly"><h3>📊 Chart Test</h3>
<iframe src="impact-test.html" style="width:100%;height:320px;border:2px solid green"></iframe></div>
</div>
<div style="text-align:center;padding:10px;color:var(--text2);font-size:11px">TEST FOOTER</div>
<script>console.log("test3 loaded");</script>
</body></html>
