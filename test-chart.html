<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="chart.umd.min.js"></script>
<style>body{background:#161b22;color:#c9d1d9;font-family:sans-serif;padding:20px}</style>
</head><body><div id="err" style="display:none;color:red;padding:10px;font-size:11px;background:#300;border-radius:4px;margin:4px"></div>
<h2>Chart.js 加载测试</h2>
<div id="status" style="color:yellow;margin:10px 0">⏳ 检测中...</div>
<canvas id="c" style="max-width:600px;height:300px"></canvas>
<script>
(function check(){
  if(typeof Chart==='undefined'){document.getElementById('status').textContent='❌ Chart.js 未加载！';return;}
  document.getElementById('status').textContent='✅ Chart.js 已加载，渲染中...';
  var ctx=document.getElementById('c').getContext('2d');
  if(!ctx){document.getElementById('status').textContent='❌ Canvas 2D 不支持！';return;}
  try{new Chart(ctx,{type:'bar',data:{labels:['A','B','C'],datasets:[{label:'Test',data:[1,2,3],backgroundColor:'#58a6ff'}]}});
  document.getElementById('status').textContent='✅ 图表渲染成功！';
})();
</script>
</body></html>
