<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>html,body{height:100%;overflow:hidden;background:#0d1117;color:#c9d1d9;font-family:sans-serif;padding:20px}
#status{font-size:14px;margin:10px 0;padding:10px;border-radius:4px}
#c{max-width:600px;height:300px;background:#161b22;border:1px solid #30363d;border-radius:4px}
</style></head><body>
<div id="status">⏳ 1/3 页面加载成功...</div>
<canvas id="c"></canvas>
<script>
var s=document.getElementById('status');
s.textContent='✅ 2/3 JS执行成功。尝试加载Chart.js...';
s.style.background='#1a3a1a';

var script=document.createElement('script');
script.src='chart.umd.min.js';
script.onload=function(){
  s.textContent='✅ 3/3 Chart.js加载成功，渲染中...';
  s.style.background='#1a4a1a';
  var ctx=document.getElementById('c').getContext('2d');
  new Chart(ctx,{type:'bar',data:{labels:['A','B','C'],datasets:[{label:'Test',data:[1,2,3],backgroundColor:'#58a6ff'}]}});
  s.textContent='✅✅✅ 全部成功！图表应已显示';
};
script.onerror=function(){
  s.textContent='❌ Chart.js加载失败！文件不存在或路径错误';
  s.style.background='#3a1a1a';
};
document.head.appendChild(script);
</script>
</body></html>
