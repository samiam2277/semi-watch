<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>body{background:#161b22;color:#c9d1d9;font-family:-apple-system,sans-serif;margin:0;padding:0}</style>
</head><body>
<canvas id="c" style="width:100%;height:260px"></canvas>
<script>
setTimeout(function(){
var ctx=document.getElementById('c').getContext('2d');
var labels=['4/1','4/15','5/1','5/15','5/27','6/1','6/10','6/17','6/22','6/24','6/30','7/3','7/8','7/13','7/17','7/22','7/24','7/28','7/29','7/30','7/31'];
var credit=[30.3,31,32,33,34.2,35,36,37,38.2,38.63,37.3,36,34.5,33.5,33,32.8,32.67,32.5,32.4,33,32];
var etfAUM=[0,0,2,3.5,4.9,7,10,13,15,15.93,14,12,9.5,9.34,8,6.5,5.5,4.8,4.5,5,5];
var kospi=[7500,8200,8500,8700,9000,9100,9200,9350,9385,9200,8500,8000,7500,6500,6200,6000,6000,5563,5663,5593,6595];

var kospiScaled=kospi.map(function(v){return v/40});

new Chart(ctx,{
  type:'line',
  data:{
    labels:labels,
    datasets:[
      {label:'信用贷款(万亿₩)',data:credit,borderColor:'#f85149',backgroundColor:'rgba(248,81,73,0.06)',fill:true,tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y'},
      {label:'杠杆ETF AUM(万亿₩)',data:etfAUM,borderColor:'#d2991d',backgroundColor:'rgba(210,153,29,0.06)',fill:true,tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y'},
      {label:'KOSPI(÷40)',data:kospiScaled,borderColor:'#58a6ff',tension:0.4,pointRadius:1.5,borderWidth:2,borderDash:[5,3],yAxisID:'y'}
    ]
  },
  options:{
    responsive:true,maintainAspectRatio:false,
    interaction:{intersect:false,mode:'index'},
    plugins:{
      legend:{labels:{color:'#8b949e',font:{size:9},usePointStyle:true,padding:14,pointStyleWidth:8}},
      annotation:false
    },
    scales:{
      x:{ticks:{color:'#8b949e',font:{size:8},maxTicksLimit:12},grid:{display:false}},
      y:{ticks:{color:'#8b949e',font:{size:8},callback:function(v){return v.toFixed(0)+(v<100?'':'');}},grid:{color:'rgba(48,54,61,0.25)'},title:{display:true,text:'万亿₩ / KOSPI÷40',color:'#8b949e',font:{size:8}}}
    }
  }
});
},300);
</script>
</body></html>
