<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>html,body{height:100%;overflow:hidden;background:#161b22;color:#c9d1d9;font-family:sans-serif;margin:0;padding:8px}</style></head><body>
<div id="s" style="font-size:11px;color:#8b949e;margin:4px 0">⏳</div>
<canvas id="c" style="width:100%;height:260px;max-height:260px"></canvas>
<script>
var st=document.getElementById('s');st.textContent='1/3 OK';
var sc=document.createElement('script');sc.src='chart.umd.min.js';
sc.onload=function(){
st.textContent='2/3 ChartJS OK';
var labels=['7/8','7/9','7/10','7/13','7/14','7/15','7/16','7/17','7/20','7/21','7/22','7/23','7/24','7/27','7/28','7/29','7/30','7/31'];
var sox=[4.9,0.1,-1.9,-2,7.9,1.5,-0.6,-2,1.4,3,6.4,2,-7.9,-1,-3,-5.3,8.2,4];
var sk=[3,0,-2,-5,5,2,-3,-4,2,4,6,2,-8,-10,-11,-9,12,30];
var bias=[0.3,0.1,-0.2,-0.4,0.3,0.2,-0.1,-0.3,0.1,0.4,0.5,0.1,-0.6,-0.5,-0.7,-0.6,0.6,0.7];
var max=Math.max.apply(null,sox.map(Math.abs).concat(sk.map(Math.abs)));
var scaled=bias.map(function(b){return b*max});
var ctx=document.getElementById('c').getContext('2d');
new Chart(ctx,{type:'line',data:{labels:labels,datasets:[
  {label:'消息偏度',data:scaled,borderColor:'#3fb950',tension:0.4,pointRadius:2,borderWidth:2},
  {label:'SOX%',data:sox,borderColor:'#58a6ff',tension:0.4,pointRadius:2,borderWidth:2},
  {label:'SK%',data:sk,borderColor:'#d2991d',tension:0.4,pointRadius:2,borderWidth:2}
]},options:{responsive:true,maintainAspectRatio:false,
  plugins:{legend:{labels:{color:'#8b949e',font:{size:9}}}},
  scales:{x:{ticks:{color:'#8b949e',font:{size:8}},grid:{display:false}},y:{ticks:{color:'#8b949e',font:{size:8},callback:function(v){return(v>=0?'+':'')+v+'%'}},grid:{color:'rgba(48,54,61,0.3)'}}}
}});
st.textContent='3/3 OK';
};
sc.onerror=function(){st.textContent='FAIL: chart.umd.min.js 404';};
document.head.appendChild(sc);
</script>
</body></html>
