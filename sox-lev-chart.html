<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>body{background:#161b22;color:#c9d1d9;font-family:-apple-system,sans-serif;margin:0;padding:0}</style>
</head><body>
<canvas id="c" style="width:100%;height:260px"></canvas>
<script>
setTimeout(function(){
var ctx=document.getElementById('c').getContext('2d');
var labels=['1/2','2/1','2/14','3/1','3/15','4/1','4/15','5/1','5/15','5/27','6/5','6/12','6/18','6/22','6/26','7/1','7/8','7/14','7/18','7/22','7/24','7/28','7/29','7/30','7/31'];
var sox=[7575,7200,7000,7080,7400,8300,9556,10300,11000,11600,12000,12657,14342,14655,13204,13353,12301,13171,11768,14635,13482,10447,10447,11303,11800];
var soxlAUM=[50,48,45,55,70,90,125,145,155,163,160,158,155,160,145,130,115,108,105,100,95,85,80,95,100];
var hfExposure=[8,7.5,7.2,9,11,13,15,17,20,22,24,23,22,24,20,19,14,13,12,11,10.5,10.3,10.3,11,12];
var soxScaled=sox.map(function(v){return v/100});

new Chart(ctx,{
  type:'line',
  data:{
    labels:labels,
    datasets:[
      {label:'SOX(÷100)',data:soxScaled,borderColor:'#58a6ff',tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y'},
      {label:'SOXL AUM($十亿)',data:soxlAUM,borderColor:'#f85149',backgroundColor:'rgba(248,81,73,0.05)',fill:true,tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y1'},
      {label:'对冲基金敞口(%)',data:hfExposure,borderColor:'#d2991d',tension:0.4,pointRadius:1.5,borderWidth:2,borderDash:[5,3],yAxisID:'y1'}
    ]
  },
  options:{
    responsive:true,maintainAspectRatio:false,
    interaction:{intersect:false,mode:'index'},
    plugins:{legend:{labels:{color:'#8b949e',font:{size:9},usePointStyle:true,padding:14,pointStyleWidth:8}}},
    scales:{
      x:{ticks:{color:'#8b949e',font:{size:8},maxTicksLimit:14},grid:{display:false}},
      y:{position:'left',ticks:{color:'#8b949e',font:{size:8}},grid:{color:'rgba(48,54,61,0.25)'},title:{display:true,text:'SOX÷100',color:'#8b949e',font:{size:8}}},
      y1:{position:'right',ticks:{color:'#8b949e',font:{size:8}},grid:{display:false},title:{display:true,text:'$B / %',color:'#8b949e',font:{size:8}}}
    }
  }
});
},300);
</script>
</body></html>
