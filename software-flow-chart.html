<!DOCTYPE html><html><head><meta charset="UTF-8">
<script>
(function(){
  var s=document.createElement('script');
  s.src='chart.umd.min.js';
  s.onload=function(){ window._chartReady=true; };
  s.onerror=function(){ document.body.innerHTML+='<div style=color:red>Chart.js加载失败</div>'; };
  document.head.appendChild(s);
},300);
</script>
<style>body{background:#161b22;color:#c9d1d9;font-family:-apple-system,sans-serif;margin:0;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 170px;gap:8px;height:100%}
.panel{font-size:10px;color:#8b949e;overflow-y:auto;max-height:270px}
.panel .sig{padding:6px 8px;margin:4px 0;border-radius:4px;font-size:10px}
.sig-sw{background:rgba(63,185,80,0.12);border-left:3px solid #3fb950}
.sig-hw{background:rgba(248,81,73,0.12);border-left:3px solid #f85149}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
</style>
</head><body>
<div class="grid2">
<div style="position:relative"><canvas id="c" style="width:100%;height:280px"></canvas></div>
<div class="panel">
<div style="font-weight:600;color:#c9d1d9;margin-bottom:8px;font-size:11px">📐 轮动节点</div>
<div class="sig sig-hw">
<div class="date">6/22 SOX ATH 14,655</div>
半导体见顶，硬件开始流出
</div>
<div class="sig sig-sw">
<div class="date">7/8 SOXX单日+$54亿</div>
ETF资金逆势抄底半导体
</div>
<div class="sig sig-sw">
<div class="date">7/22 GOOGL财报</div>
云+82%但FCF转负→弃硬投软加速
</div>
<div class="sig sig-hw">
<div class="date">7/28-29 KOSPI熔断</div>
半导体恐慌底，软件继续涨
</div>
<div class="sig sig-sw">
<div class="date">7/30 MSFT财报</div>
Azure43%+Capex可控→硬件暴力反弹
</div>
<div style="margin-top:8px;font-size:9px;border-top:1px solid #30363d;padding-top:6px">
<span style="color:#3fb950">🟢软件</span> 7月+6% 机构增配<br>
<span style="color:#f85149">🔴硬件</span> 7月-25% 对冲基金减<br>
<span style="color:#a371f7">🟣Mag7</span> 分化严重(MSFT+15,GOOGL-7)<br>
<span style="color:#8b949e">📐轮动未完</span> 主动基金未回硬件
</div>
</div>
</div>
<script>
setTimeout(function(){
var ctx=document.getElementById('c').getContext('2d');
var labels=["5/1", "5/8", "5/15", "5/22", "5/29", "6/5", "6/12", "6/18", "6/22", "6/26", "7/1", "7/8", "7/14", "7/17", "7/21", "7/23", "7/25", "7/28", "7/29", "7/30", "7/31"]}});

new Chart(ctx,{
  type:'line',
  data:{
    labels:labels,
    datasets:[
      {label:'软件IGV',data:soft,borderColor:'#3fb950',backgroundColor:'rgba(63,185,80,0.1)',fill:true,tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y'},
      {label:'Mag7加权',data:mag7,borderColor:'#a371f7',tension:0.4,pointRadius:1.5,borderWidth:2.5,borderDash:[5,3],yAxisID:'y'},
      {label:'半导体SOXX',data:semi,borderColor:'#58a6ff',backgroundColor:'rgba(88,166,255,0.06)',fill:true,tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y'},
      {label:'软-硬价差',data:spread,borderColor:'#d2991d',tension:0.4,pointRadius:1.5,borderWidth:2,borderDash:[2,2],yAxisID:'y1'}
    ]
  },
  options:{
    responsive:true,maintainAspectRatio:false,
    interaction:{intersect:false,mode:'index'},
    plugins:{
      legend:{labels:{color:'#8b949e',font:{size:9},usePointStyle:true,padding:14,pointStyleWidth:8}},
      tooltip:{callbacks:{label:function(ctx){var v=ctx.parsed.y.toFixed(1);return ctx.dataset.label+': '+(v>=0?'+':'')+v;}}}
    },
    scales:{
      x:{ticks:{color:'#8b949e',font:{size:8},maxTicksLimit:12},grid:{display:false}},
      y:{position:'left',ticks:{color:'#8b949e',font:{size:8}},grid:{color:'rgba(48,54,61,0.25)'},title:{display:true,text:'归一化(5/1=100)',color:'#8b949e',font:{size:8}}},
      y1:{position:'right',ticks:{color:'#d2991d',font:{size:8}},grid:{display:false},title:{display:true,text:'价差',color:'#d2991d',font:{size:8}}}
    }
  }
});
},300);
</script>
</body></html>
