<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>body{background:#161b22;color:#c9d1d9;font-family:-apple-system,sans-serif;margin:0;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 180px;gap:8px;height:100%}
.panel{font-size:10px;color:#8b949e;overflow-y:auto;max-height:270px}
.panel .sig{padding:5px 7px;margin:2px 0;border-radius:4px;font-size:10px}
.sig-r{background:rgba(248,81,73,0.12);border-left:3px solid #f85149}
.sig-g{background:rgba(63,185,80,0.12);border-left:3px solid #3fb950}
.sig-y{background:rgba(210,153,29,0.12);border-left:3px solid #d2991d}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<div class="grid2">
<div style="position:relative"><canvas id="c" style="width:100%;height:280px"></canvas></div>
<div class="panel">
<div style="font-weight:600;color:#c9d1d9;margin-bottom:8px;font-size:11px">流入🟢 vs 流出🔴</div>
<div class="sig sig-r"><b>1-2月 流出</b><br>获利了结+DeepSeek<br>累计−$23亿</div>
<div class="sig sig-g"><b>3-6月中 持续流入</b><br>Capex驱动 机构+散户<br>6/15峰值累计+$114亿</div>
<div class="sig sig-r"><b>6月下-7月底 大流出</b><br>Q2财报密集暴雷<br>GOOGL/META/TSLA遭抛售</div>
<div class="sig sig-y"><b>7/22-29 最惨周</b><br>−$35亿 3家财报miss<br>FCF焦虑主导</div>
<div class="sig sig-g"><b>7/30-31 回补</b><br>+$42亿 MSFT+AMZN<br>带动选择性回场</div>
<div style="margin-top:6px;font-size:9px;border-top:1px solid #30363d;padding-top:4px">
流入: <span style="color:#3fb950">11周 $156亿</span><br>
流出: <span style="color:#f85149">6周 −$165亿</span><br>
净: <span style="color:#d2991d">−$9亿</span> (分化严重)
</div>
</div>
</div>
<script>
function initChart(){if(typeof Chart==='undefined'){setTimeout(initChart,200);return;}
var ctx=document.getElementById('c').getContext('2d');
var labels=["1\u6708", "2\u6708", "3\u6708\u4e0a", "3\u6708\u4e0b", "4\u6708", "5\u6708\u4e0a", "5\u6708\u4e0b", "6\u6708\u4e0a", "6\u6708\u4e2d", "6\u6708\u4e0b", "7\u6708\u4e0a", "7/8-14", "7/15-21", "7/22-24", "7/25-28", "7/29", "7/30-31"]

new Chart(ctx,{type:'bar',
  data:{labels:labels,datasets:[
    {label:'流入(亿$)',data:inflow,backgroundColor:'rgba(63,185,80,0.7)',borderColor:'#3fb950',borderWidth:1,borderRadius:2,stack:'flow',order:2},
    {label:'流出(亿$)',data:outflow,backgroundColor:'rgba(248,81,73,0.7)',borderColor:'#f85149',borderWidth:1,borderRadius:2,stack:'flow',order:2},
    {label:'累计净流(亿$)',data:cumul,borderColor:'#d2991d',tension:0.4,pointRadius:2,borderWidth:2.5,type:'line',yAxisID:'y1',order:1},
    {label:'MSFT代理',data:msft,borderColor:'#3fb950',tension:0.4,pointRadius:0,borderWidth:1.5,borderDash:[3,3],type:'line',yAxisID:'y1',order:1},
    {label:'GOOGL代理',data:googl,borderColor:'#a371f7',tension:0.4,pointRadius:0,borderWidth:1.5,borderDash:[3,3],type:'line',yAxisID:'y1',order:1}
  ]},
  options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
    plugins:{legend:{labels:{color:'#8b949e',font:{size:8},usePointStyle:true,padding:12}}},
    scales:{
      x:{ticks:{color:'#8b949e',font:{size:8},maxTicksLimit:12},grid:{display:false},stacked:true},
      y:{stacked:true,position:'left',ticks:{color:'#8b949e',font:{size:8},callback:function(v){{return(v>=0?'+':'')+'$'+v+'亿'}}},grid:{color:'rgba(48,54,61,0.25)'},title:{display:true,text:'周度流量',color:'#8b949e',font:{size:8}}},
      y1:{position:'right',ticks:{color:'#d2991d',font:{size:8},callback:function(v){{return(v>=0?'+':'')+'$'+v+'亿'}}},grid:{display:false},title:{display:true,text:'累计/代理($亿)',color:'#d2991d',font:{size:8}}}
    }
  }});
}initChart();
</script>
</body></html>
