<!DOCTYPE html><html><head><meta charset="UTF-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>body{background:#161b22;color:#c9d1d9;font-family:-apple-system,sans-serif;margin:0;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 180px;gap:8px;height:100%}
.panel{font-size:10px;color:#8b949e;overflow-y:auto;max-height:270px}
.panel .sig{padding:5px 7px;margin:2px 0;border-radius:4px;font-size:10px}
.sig-r{background:rgba(248,81,73,0.12);border-left:3px solid #f85149}
.sig-g{background:rgba(63,185,80,0.12);border-left:3px solid #3fb950}
.sig-y{background:rgba(210,153,29,0.12);border-left:3px solid #d2991d}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<div class="grid2">
<div style="position:relative"><canvas id="c" style="width:100%;height:280px"></canvas></div>
<div class="panel">
<div style="font-weight:600;color:#c9d1d9;margin-bottom:8px;font-size:11px">📐 八个月资金脉络</div>
<div class="sig sig-r"><b>1-2月 高位减仓</b><br>年末获利+DeepSeek恐慌<br>Mag7整体净流出</div>
<div class="sig sig-g"><b>3-4月 全面回场</b><br>Q1 13F翻多<br>Capex预期驱动买入</div>
<div class="sig sig-g"><b>5-6月中 加速流入</b><br>AI叙事极致乐观<br>机构+散户+杠杆共振</div>
<div class="sig sig-r"><b>6月下-7月中 大分化</b><br>GOOGL/META/TSLA遭抛售<br>AAPL独自新高吸金</div>
<div class="sig sig-y"><b>7月22-29 财报季</b><br>Q2密集轰炸<br>MSFT+AMZN涨 GOOGL+META跌</div>
<div class="sig sig-g"><b>7/30-31 分化收敛</b><br>MSFT+15%带动全组修复<br>主动基金选择性回补</div>
<div style="margin-top:6px;font-size:9px;border-top:1px solid #30363d;padding-top:4px">
8个月净流向: <span style="color:#3fb950">机构仍净多</span><br>
Q2财报季: <span style="color:#d2991d">赢家MSFT/AMZN</span><br>
<span style="color:#f85149">输家GOOGL/META/TSLA</span><br>
当前: 分化中回补
</div>
</div>
</div>
<script>
setTimeout(function(){
var ctx=document.getElementById('c').getContext('2d');
var labels=['1月','2月','3月上','3月下','4月','5月上','5月下','6月上','6月中','6月下','7月上','7/8-14','7/15-21','7/22-24','7/25-28','7/29','7/30-31'];
var mag7=[-8,-15,5,12,18,22,25,30,25,-10,-20,-15,-12,-30,-25,-35,42];
var cumul=[-8,-23,-18,-6,12,34,59,89,114,104,84,69,57,27,2,-33,9];
// MSFT vs GOOGL divergence
var msft=[-2,-5,2,4,6,7,8,10,8,-3,-6,-4,-3,-8,-6,-10,20];
var googl=[-3,-6,1,3,5,6,7,9,5,-8,-7,-5,-4,-12,-10,-15,2];

new Chart(ctx,{type:'line',
  data:{labels:labels,datasets:[
    {label:'Mag7周度净流向(亿$)',data:mag7,borderColor:'#58a6ff',backgroundColor:function(ctx){var v=mag7[ctx.dataIndex];return v>=0?'rgba(88,166,255,0.12)':'rgba(248,81,73,0.12)';},fill:true,tension:0.3,pointRadius:2,borderWidth:2.5,type:'bar',yAxisID:'y'},
    {label:'累计净流向(亿$)',data:cumul,borderColor:'#d2991d',tension:0.4,pointRadius:1.5,borderWidth:2.5,yAxisID:'y1'},
    {label:'MSFT(代理)',data:msft,borderColor:'#3fb950',tension:0.4,pointRadius:0,borderWidth:1.5,borderDash:[3,3],yAxisID:'y'},
    {label:'GOOGL(代理)',data:googl,borderColor:'#a371f7',tension:0.4,pointRadius:0,borderWidth:1.5,borderDash:[3,3],yAxisID:'y'}
  ]},
  options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},
    plugins:{legend:{labels:{color:'#8b949e',font:{size:8},usePointStyle:true,padding:12}}},
    scales:{
      x:{ticks:{color:'#8b949e',font:{size:8},maxTicksLimit:12},grid:{display:false}},
      y:{position:'left',ticks:{color:'#8b949e',font:{size:8},callback:function(v){{return(v>=0?'+':'')+'$'+v+'亿'}}},grid:{color:'rgba(48,54,61,0.25)'},title:{display:true,text:'周度流向',color:'#8b949e',font:{size:8}}},
      y1:{position:'right',ticks:{color:'#d2991d',font:{size:8},callback:function(v){{return(v>=0?'+':'')+'$'+v+'亿'}}},grid:{display:false},title:{display:true,text:'累计($亿)',color:'#d2991d',font:{size:8}}}
    }
  }});
},300);
</script>
</body></html>
